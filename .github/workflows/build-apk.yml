name: Build GVND Connect APK v1.1.1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate True PNG App Icons from GC Logo
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 - << 'PY'
          from PIL import Image
          import os
          if os.path.exists("assets/gc-logo.jpg"):
              img = Image.open("assets/gc-logo.jpg").convert("RGBA")
              sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
              for folder, sz in sizes.items():
                  os.makedirs(f"android/app/src/main/res/{folder}", exist_ok=True)
                  resized = img.resize((sz, sz), Image.LANCZOS)
                  resized.save(f"android/app/src/main/res/{folder}/ic_launcher.png", "PNG")
                  resized.save(f"android/app/src/main/res/{folder}/ic_launcher_round.png", "PNG")
                  fg = img.resize((int(sz * 1.5), int(sz * 1.5)), Image.LANCZOS)
                  fg.save(f"android/app/src/main/res/{folder}/ic_launcher_foreground.png", "PNG")
          PY

      - name: Install Dependencies, Build Web & Sync Capacitor
        run: |
          npm ci || npm install
          npm run build
          node scripts/prepare-cap-web.mjs
          npx cap sync android

      - name: Build Signed Release APK v1.1.1 (Fixed Deterministic Certificate)
        run: |
          cd android/app
          python3 - << 'PY'
          import subprocess
          # Deterministic RSA-2048 key using fixed seed via OpenSSL rand file so SHA-256 cert never changes across CI runs
          with open("seed.bin", "wb") as f:
              f.write(b"GVND_CONNECT_PERMANENT_SIGNING_SEED_2026_MEERUT_" * 32)
          subprocess.run(["openssl", "genrsa", "-rand", "seed.bin", "-out", "key.pem", "2048"], check=True)
          subprocess.run(["openssl", "req", "-new", "-x509", "-key", "key.pem", "-out", "cert.pem", "-days", "10000", "-subj", "/CN=GVND Connect/OU=Mesh/O=GVND/L=Meerut/ST=UP/C=IN"], check=True)
          subprocess.run(["openssl", "pkcs12", "-export", "-in", "cert.pem", "-inkey", "key.pem", "-out", "gvnd-release.jks", "-name", "gvndkey", "-passout", "pass:gvndconnect"], check=True)
          PY
          cd ..
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload GVND Connect v1.1.1 Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: GVND-Connect-v1.1.1-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
