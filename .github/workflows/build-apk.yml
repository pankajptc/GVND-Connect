name: Build GVND Connect APK v1.0.2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Dependencies, Build Web & Sync Capacitor
        run: |
          npm ci || npm install
          npm run build
          npx cap sync android
      - name: Generate Release Signing Keystore & Build Signed APK
        run: |
          cd android/app
          keytool -genkeypair -v -keystore gvnd-release.jks -alias gvndkey -keyalg RSA -keysize 2048 -validity 10000 -storepass gvndconnect -keypass gvndconnect -dname "CN=GVND Connect, OU=Mesh, O=GVND, L=Meerut, ST=UP, C=IN"
          cd ..
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload GVND Connect Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GVND-Connect-v1.0.2-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
